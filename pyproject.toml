[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ethscan"
version = "0.1.0"
description = "An ethical hacking toolkit"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "dnspython>=2.0",
    "mypy>=1.0",
]
dns = [
    "dnspython>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ethscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.package-data]
ethscan = ["py.typed"]

[project.scripts]
ethscan = "ethscan.cli:cli"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "BLE001", "S110"]
